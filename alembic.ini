# Alembic de OIP (CMP-19; design.md §4 y §5). Las migraciones viven en migrations/.
#
# La URL de la base NO va en este archivo ni en el repo: env.py la toma de OIP_DATABASE_URL
# (o de la conexión que le pasa quien llama, como las pruebas de integración). Nunca se
# registra (RNF-8).

[alembic]
script_location = %(here)s/migrations
path_separator = os
version_path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
