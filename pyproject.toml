[project]
name = "oip-core"
version = "0.0.0"
description = "Offer Intelligence Platform (OIP), Core. Proyecto personal y privado."
readme = "README.md"
requires-python = ">=3.12"
# Dependencias de la parte B (design.md §5 de req-2026-0001-b-evaluacion). Ninguna es cliente HTTP.
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # O-4 (Jesús, 2026-11-18): zone.tab con las zonas vigentes. Europe/Kyiv entra en 2022b y
    # America/Ciudad_Juarez en 2022g (tzdata 2022.7); 2024.1 (IANA 2024a) trae las dos.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "scenario(id): escenario del REQ que cubre la prueba, por ejemplo scenario('B1')",
    "integracion: necesita PostgreSQL + TimescaleDB; se salta sin OIP_TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
# S101: assert es la forma normal de verificar en pytest.
per-file-ignores = { "tests/**" = ["S101"] }
