# Gates automáticos de OIP (Etapa 3 mínima, EXT-001).
# Pendientes para la Etapa 3 completa: gitleaks y umbral de cobertura.
name: gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  pruebas:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=oip --cov-report=term-missing

  seguridad:
    name: Seguridad (egress, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/check-egress.sh src
      - run: pip install bandit pip-audit
      - run: bandit -q -r src
      - run: pip-audit --strict --skip-editable .

  openspec:
    name: OpenSpec (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @fission-ai/openspec@2.1.0 validate --all --no-interactive
        env:
          OPENSPEC_TELEMETRY: "0"

  trazabilidad:
    name: Trazabilidad (Refs y Change)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trailers de cada commit del PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! bash scripts/check-commit-msg.sh /tmp/msg; then
              echo "  commit $sha"
              fail=1
            fi
          done
          exit "$fail"
